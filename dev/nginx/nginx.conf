server {
    listen 80;
    listen 443 ssl;
    server_name _;

    # Certificat de Let's Encrypt muntat des de l'amfitrió (/etc/letsencrypt)
    ssl_certificate     /etc/letsencrypt/live/howmuchgrup6.dam.inspedralbes.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/howmuchgrup6.dam.inspedralbes.cat/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket del game-service
    location /ws {
        proxy_pass http://game-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API d'autenticació (mateix origen: sense CORS ni localhost)
    location /auth-api/ {
        proxy_pass http://auth-service:3011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API d'estadístiques
    location /stats-api/ {
        proxy_pass http://stats-service:3012/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vue Router (createWebHistory) necessita tornar index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
